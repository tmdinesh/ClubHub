services:
  # Static React/Vite frontend
  - type: web
    name: ccops-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ccops-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # FastAPI API
  - type: web
    name: ccops-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ccops-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ccops-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ccops-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: ccops-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RABBITMQ_URL
        sync: false

  # Background event and notification worker
  - type: worker
    name: ccops-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ccops-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ccops-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: ccops-backend
          envVarKey: JWT_SECRET
      - key: RABBITMQ_URL
        sync: false

  # Managed Redis-compatible Key Value store
  - type: keyvalue
    name: ccops-redis
    plan: free
    ipAllowList: []

databases:
  - name: ccops-postgres
    databaseName: ccops
    user: ccops_user
    plan: free
