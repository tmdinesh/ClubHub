services:
  # 1. Frontend SPA (React + Vite)
  - type: web
    name: ccops-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ccops-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. FastAPI Backend Service (Docker)
  - type: web
    name: ccops-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ccops-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ccops-redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

  # 3. Asynchronous Background Worker Process
  - type: worker
    name: ccops-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ccops-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ccops-redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

  # 4. Managed Redis Instance
  - type: redis
    name: ccops-redis
    ipAllowList: [] # internal connections only
    plan: free

# 5. Managed PostgreSQL Database
databases:
  - name: ccops-postgres
    databaseName: ccops
    user: ccops_user
    plan: free
